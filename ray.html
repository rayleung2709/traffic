<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dr Ray's Traffic ETA</title>
<style>
  * { box-sizing: border-box; }
  body {
    background:#000;
    color:#fff;
    font-family:-apple-system,"PingFang HK","Noto Sans HK",sans-serif;
    margin:0;
    padding:0 0 30px;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:#000;
    padding:16px 16px 10px;
  }
  h1{ font-size:20px; text-align:center; margin:0 0 12px; font-weight:700; }
  .refresh-info{
    display:flex; align-items:center; justify-content:center;
    gap:10px; font-size:12px; color:#8b8f98; margin-bottom:10px;
    flex-wrap:wrap;
  }
  .refresh-track{ width:100px; height:4px; background:#2a2c31; border-radius:2px; overflow:hidden; }
  .refresh-bar{ height:100%; width:100%; background:#0a84ff; transition:width 1s linear; }
  .last-update-text{ font-family:"SF Mono",Menlo,monospace; }
  .refresh-btn{
    border:none; background:#1c1e24; color:#fff;
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px; line-height:1;
    transition:background .2s ease, opacity .2s ease;
  }
  .refresh-btn:active{ background:#0a84ff; }
  .refresh-btn.spinning{ animation:spin .8s linear infinite; }
  .refresh-btn:disabled{ opacity:.4; cursor:not-allowed; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

  .filter-tabs{ display:flex; gap:8px; overflow-x:auto; justify-content:center; padding-bottom:4px; }
  .tab{
    border:none; background:#1c1e24; color:#fff; padding:7px 16px;
    border-radius:16px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:#0a84ff; }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    max-width:1100px;
    margin:16px auto 0;
    padding:0 14px;
  }
  @media (max-width:520px){ .grid{ gap:10px; padding:0 8px; } }
  @media (min-width:700px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:1000px){ .grid{ grid-template-columns:repeat(4,1fr); } }

  .card{
    background:#16181d;
    border-radius:26px;
    padding:16px 16px 14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:200px;
  }

  .card-top{ display:flex; justify-content:flex-start; align-items:flex-start; }
  .route-badge{
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:19px; color:#000;
    background:#F4C40F; /* 巴士：黃色 */
  }
  .route-badge.gmb{ background:#3aa757; color:#fff; } /* 專線小巴：綠色 */

  .stop-name{ font-size:21px; font-weight:800; margin-top:10px; line-height:1.25; }
  .direction{ font-size:15px; color:#b8bcc4; margin-top:2px; }
  .direction.stale{ color:#ff9f0a; }
  .eta-minutes{ font-size:15px; color:#b8bcc4; margin-top:2px; }
  .card-updated{ font-size:11px; color:#5c5f66; margin-top:6px; font-family:"SF Mono",Menlo,monospace; }

  .card-bottom{ display:flex; justify-content:flex-end; align-items:flex-end; margin-top:10px; }
  .big-countdown{
    font-size:38px; font-weight:800;
    font-variant-numeric:tabular-nums; letter-spacing:-1px;
  }
  .big-countdown.soon{ color:#ff453a; }
  .big-countdown.stale-expired{ color:#ff9f0a; font-size:22px; }

  /* ---- 港鐵卡：左邊嘅路綫直線指示 ---- */
  .card.mtr{ flex-direction:row; gap:12px; }
  .mtr-track{ width:14px; display:flex; flex-direction:column; align-items:center; padding:4px 0; }
  .mtr-track .dot{ width:10px; height:10px; border-radius:50%; border:2.5px solid #fff; background:#16181d; }
  .mtr-track .line{ flex:1; width:3px; margin:2px 0; border-radius:2px; }
  .mtr-content{ flex:1; display:flex; flex-direction:column; justify-content:space-between; }
  .line-pill{
    display:inline-block; padding:3px 10px; border-radius:10px;
    font-size:13px; font-weight:700; color:#fff; margin-top:6px; width:fit-content;
  }

  .error-wrap{ display:flex; align-items:center; gap:4px; font-size:13px; color:#ff9f0a; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Dr Ray's Traffic ETA</h1>
  <div class="refresh-info">
    <span id="nextRefresh">下次更新: 30s</span>
    <div class="refresh-track"><div class="refresh-bar" id="refreshBar"></div></div>
    <button class="refresh-btn" id="refreshBtn" title="即刻更新" aria-label="即刻更新">⟳</button>
    <span class="last-update-text" id="lastUpdateText">最後更新: --:--:--</span>
  </div>
  <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="路線類型篩選">
    <button class="tab" role="tab" aria-selected="true" data-filter="all">全部</button>
    <button class="tab" role="tab" aria-selected="false" data-filter="mtr">港鐵</button>
    <button class="tab" role="tab" aria-selected="false" data-filter="gmb">專線小巴</button>
    <button class="tab" role="tab" aria-selected="false" data-filter="ctb">巴士</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
/* ========== 設定：一張卡 = 一個路線/一條綫 + 一個方向 ========== */

const LINE_COLORS = {
  KTL:"#00A040", TML:"#9A3B26", ISL:"#0075C2",
  TWL:"#E2231A", EAL:"#5EB7E8", SIL:"#B5BD00",
  TCL:"#F7943E", AEL:"#00888A",
};
const LINE_NAMES = {
  KTL:"觀塘綫", TML:"屯馬綫", ISL:"港島綫", TWL:"荃灣綫",
  EAL:"東鐵綫", SIL:"南港島綫", TCL:"東涌綫", AEL:"機場快綫",
};

const MTR_CONFIG = [
  { title:"鑽石山", line:"KTL", sta:"DIH", dirKey:"DOWN", dirLabel:"黃埔" },
  { title:"鑽石山", line:"KTL", sta:"DIH", dirKey:"UP",   dirLabel:"調景嶺" },
  { title:"鑽石山", line:"TML", sta:"DIH", dirKey:"UP",   dirLabel:"屯門" },
  { title:"鑽石山", line:"TML", sta:"DIH", dirKey:"DOWN", dirLabel:"烏溪沙" },
  { title:"銅鑼灣", line:"ISL", sta:"CAB", dirKey:"DOWN", dirLabel:"堅尼地城" },
  { title:"銅鑼灣", line:"ISL", sta:"CAB", dirKey:"UP",   dirLabel:"柴灣" },
  { title:"鰂魚涌", line:"ISL", sta:"QUB", dirKey:"DOWN", dirLabel:"堅尼地城" },
  { title:"鰂魚涌", line:"ISL", sta:"QUB", dirKey:"UP",   dirLabel:"柴灣" },
];

const CTB_CONFIG = [
  { title:"寶雲道，司徒拔道", route:"15", stop:"002506" },
  { title:"金鐘 - 金鐘花園，金鐘道", route:"15", stop:"001136" },
  { title:"寶雲道，司徒拔道", route:"6",  stop:"002506" },
  { title:"金鐘 - 金鐘花園，金鐘道", route:"6",  stop:"001136" },
];

/* ---- GMB：region 係 "HKI"/"KLN"/"NT"，route 係路線編號
   stopMatch 係站名關鍵字（用嚟喺 route-stop 清單裡面搵對應嗰個站）
   occurrence：如果同一名稱嘅站喺路線裡面出現多次，用呢個揀第幾個（預設1）
   direction：如果知道 route_seq 對應嘅方向係第幾個 (1或2)，可以加呢個縮窄範圍，唔加就兩邊都搵
   （建議：如果確定咗方向，填埋 direction 會令搜尋更穩定、減少揀錯方向嘅風險） ---- */
const GMB_CONFIG = [
  { title:"港安醫院",   region:"HKI", route:"26", stopMatch:"港安醫院", occurrence:1 },
  { title:"鳳鳴大廈外", region:"HKI", route:"26", stopMatch:"鳳鳴大廈", occurrence:1 },
];

const STALE_THRESHOLD_MS = 70000; // 超過大約2個refresh週期就當過時

/* ========== 共用function ========== */

function secsLeft(t){
  if(!t) return null;
  const diff = Math.round((new Date(t).getTime() - Date.now())/1000);
  return diff < 0 ? 0 : diff;
}

function bigCountdownText(sec, staleExpired){
  if(sec===null) return "--:--";
  if(staleExpired) return "已失效";
  if(sec<=0) return "到站";
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}

function timeHHMMSS(date){
  return date.toTimeString().slice(0,8);
}

// 帶timeout嘅fetch，超時或者HTTP錯誤都會拋出清晰嘅訊息
async function fetchWithTimeout(url, ms=8000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try{
    const res = await fetch(url, { signal: controller.signal });
    if(!res.ok) throw new Error(`伺服器錯誤 (${res.status})`);
    return res;
  }catch(err){
    if(err.name === "AbortError") throw new Error("請求逾時");
    if(err instanceof TypeError) throw new Error("連線失敗");
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/* ========== 卡片建立（動態文字用textContent嗌set，避免innerHTML注入風險） ========== */

function makeBusCard(id, title, badgeText, badgeClass, dataType){
  const div=document.createElement("div");
  div.className="card bus";
  div.id=id;
  div.dataset.type=dataType;

  const top=document.createElement("div");
  top.className="card-top";
  const badge=document.createElement("div");
  badge.className="route-badge" + (badgeClass ? " "+badgeClass : "");
  badge.textContent=badgeText;
  top.appendChild(badge);

  const stopName=document.createElement("div");
  stopName.className="stop-name";
  stopName.textContent=title;

  const direction=document.createElement("div");
  direction.className="direction body-direction";
  direction.textContent="載入中…";

  const etaMin=document.createElement("div");
  etaMin.className="eta-minutes body-etaminutes";

  const updated=document.createElement("div");
  updated.className="card-updated body-updated";

  const bottom=document.createElement("div");
  bottom.className="card-bottom";
  const bigCd=document.createElement("div");
  bigCd.className="big-countdown body-bigcountdown";
  bigCd.textContent="--:--";
  bottom.appendChild(bigCd);

  div.append(top, stopName, direction, etaMin, updated, bottom);
  return div;
}

function makeMtrCard(id, cfg){
  const color = LINE_COLORS[cfg.line] || "#888";
  const div=document.createElement("div");
  div.className="card mtr";
  div.id=id;
  div.dataset.type="mtr";

  const track=document.createElement("div");
  track.className="mtr-track";
  track.innerHTML=`
    <span class="dot" style="border-color:${color}"></span>
    <span class="line" style="background:${color}"></span>
    <span class="dot" style="border-color:${color}"></span>`;

  const content=document.createElement("div");
  content.className="mtr-content";

  const top=document.createElement("div");
  top.className="card-top";
  const stopName=document.createElement("div");
  stopName.className="stop-name";
  stopName.textContent=cfg.title;
  top.appendChild(stopName);

  const pill=document.createElement("div");
  pill.className="line-pill";
  pill.style.background=color;
  pill.textContent=LINE_NAMES[cfg.line]||cfg.line;

  const direction=document.createElement("div");
  direction.className="direction body-direction";
  direction.textContent="載入中…";

  const etaMin=document.createElement("div");
  etaMin.className="eta-minutes body-etaminutes";

  const updated=document.createElement("div");
  updated.className="card-updated body-updated";

  const bottom=document.createElement("div");
  bottom.className="card-bottom";
  const bigCd=document.createElement("div");
  bigCd.className="big-countdown body-bigcountdown";
  bigCd.textContent="--:--";
  bottom.appendChild(bigCd);

  content.append(top, pill, direction, etaMin, updated, bottom);
  div.append(track, content);
  return div;
}

/* ========== 資料層：淨係存絕對時間 + 每卡最後成功更新時間 ========== */

const state = {};

function setCardData(cardId, direction, etaAbsArr){
  state[cardId] = {
    direction,
    etaAbs: etaAbsArr,
    error:null,
    lastSuccess: Date.now()
  };
  renderCard(cardId);
}
function setCardError(cardId, msg){
  if(!state[cardId]) state[cardId] = { direction:"", etaAbs:[], lastSuccess:null };
  state[cardId].error = msg;
  renderCard(cardId);
}

function renderCard(cardId){
  const s = state[cardId];
  const card = document.getElementById(cardId);
  if(!s || !card) return;

  const dirEl = card.querySelector(".body-direction");
  const etaEl = card.querySelector(".body-etaminutes");
  const bigEl = card.querySelector(".body-bigcountdown");
  const updEl = card.querySelector(".body-updated");

  // 完全冇資料 + 出錯 → 顯示錯誤畫面（用textContent，避免任何注入風險）
  if(s.error && (!s.etaAbs || s.etaAbs.length===0)){
    dirEl.textContent = "";
    dirEl.classList.remove("stale");
    etaEl.innerHTML = "";
    const wrap = document.createElement("span");
    wrap.className = "error-wrap";
    wrap.textContent = "⚠️ " + s.error;
    etaEl.appendChild(wrap);
    bigEl.textContent = "--:--";
    bigEl.classList.remove("soon","stale-expired");
    updEl.textContent = "";
    return;
  }

  const secsArr = s.etaAbs.map(secsLeft);
  const isStale = s.lastSuccess && (Date.now() - s.lastSuccess > STALE_THRESHOLD_MS);
  const showWarning = s.error || isStale;

  dirEl.textContent = "往 " + s.direction + (showWarning ? " ⚠️" : "");
  dirEl.classList.toggle("stale", !!showWarning);
  dirEl.title = s.error
    ? `今次更新失敗，顯示嘅係舊資料：${s.error}`
    : (isStale ? "資料可能已過時" : "");

  etaEl.textContent = secsArr.slice(1).map(sec=>{
    if(sec===null) return "--";
    return Math.max(0, Math.round(sec/60)) + "分";
  }).join(" / ");

  updEl.textContent = s.lastSuccess ? ("更新於 " + timeHHMMSS(new Date(s.lastSuccess))) : "";

  // 資料過時之餘倒數又跌到0，唔應該顯示「到站」（會誤導），改顯示「已失效」
  const primarySec = secsArr[0];
  const staleExpired = isStale && primarySec !== null && primarySec <= 0;

  bigEl.textContent = bigCountdownText(primarySec, staleExpired);
  bigEl.classList.toggle("soon", primarySec!==null && primarySec<=60 && !staleExpired);
  bigEl.classList.toggle("stale-expired", staleExpired);
}

function renderAllCards(){ Object.keys(state).forEach(renderCard); }

/* ========== MTR fetch（帶cache + pending-promise，防止race condition重複fetch） ========== */

const mtrCache = {};
async function fetchMtrStation(line, sta, force=false){
  const key = `${line}-${sta}`;
  const now = Date.now();
  if(!force && mtrCache[key]?.data && now - mtrCache[key].ts < 15000) return mtrCache[key].data;
  if(mtrCache[key]?.pending) return mtrCache[key].pending;

  const p = (async()=>{
    try{
      const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}&lang=TC`;
      const res = await fetchWithTimeout(url);
      const json = await res.json();
      if(json.status===0) throw new Error(json.message || "服務調整");
      const data = json.data && json.data[key];
      mtrCache[key] = { ts:Date.now(), data };
      return data;
    }catch(err){
      delete mtrCache[key]; // 失敗要清走cache，否則下次會攞到同一個已reject嘅promise
      throw err;
    }
  })();

  mtrCache[key] = { pending:p };
  return p;
}

/* ========== 各資料源嘅fetch function：統一回傳 { direction, etaAbs } 或者 throw Error ========== */

async function fetchMtrEta(cfg, force){
  const raw = await fetchMtrStation(cfg.line, cfg.sta, force);
  const arr = (raw && raw[cfg.dirKey]) || [];
  return { direction: cfg.dirLabel, etaAbs: arr.slice(0,3).map(t=>t.time) };
}

async function fetchCtbEta(cfg){
  const url = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${cfg.stop}/${cfg.route}`;
  const res = await fetchWithTimeout(url);
  const json = await res.json();
  const arr = json.data || [];
  const direction = arr[0]?.dest_tc || arr[0]?.dest_en || "";
  return { direction, etaAbs: arr.slice(0,3).map(t=>t.eta) };
}

/* ---- GMB：三層 API（route → route-stop → eta），帶 cache ---- */

const gmbRouteCache = {};   // key: region-route  → routeList
const gmbStopCache = {};    // key: routeId-routeSeq → stops[]

async function fetchGmbRoute(region, route){
  const key = `${region}-${route}`;
  if(gmbRouteCache[key]) return gmbRouteCache[key];
  const res = await fetchWithTimeout(`https://data.etagmb.gov.hk/route/${region}/${route}`);
  const json = await res.json();
  const routeData = json.data;
  const routeList = Array.isArray(routeData) ? routeData : (routeData ? [routeData] : []);
  gmbRouteCache[key] = routeList;
  return routeList;
}

async function fetchGmbRouteStops(routeId, routeSeq){
  const key = `${routeId}-${routeSeq}`;
  if(gmbStopCache[key]) return gmbStopCache[key];
  const res = await fetchWithTimeout(`https://data.etagmb.gov.hk/route-stop/${routeId}/${routeSeq}`);
  const json = await res.json();
  const stops = (json.data && json.data.route_stops) ? json.data.route_stops : [];
  gmbStopCache[key] = stops;
  return stops;
}

// 搵到目標站之後，攞返 route_id / route_seq / stop_seq / dest 名
// 用 Promise.all 令唔同方向嘅 route-stop 查詢可以並行，加快首次載入
async function findGmbStop(cfg){
  const routeList = await fetchGmbRoute(cfg.region, cfg.route);
  if(routeList.length===0) throw new Error("搵唔到路線資料");

  const lookupTasks = [];
  for(const r of routeList){
    const routeId = r.route_id;
    for(const dirInfo of (r.directions || [])){
      if(cfg.direction && dirInfo.route_seq !== cfg.direction) continue;
      lookupTasks.push(
        fetchGmbRouteStops(routeId, dirInfo.route_seq).then(stops=>({ routeId, dirInfo, stops }))
      );
    }
  }

  const results = await Promise.all(lookupTasks);
  const matches = [];
  results.forEach(({ routeId, dirInfo, stops })=>{
    stops.forEach(s=>{
      if(s.name_tc && s.name_tc.includes(cfg.stopMatch)){
        matches.push({
          route_id: routeId,
          route_seq: dirInfo.route_seq,
          stop_seq: s.stop_seq,
          name: s.name_tc,
          dest: dirInfo.dest_tc,
        });
      }
    });
  });

  if(matches.length===0) throw new Error(`搵唔到站名含「${cfg.stopMatch}」`);
  const occIdx = (cfg.occurrence || 1) - 1;
  return matches[occIdx] || matches[0];
}

async function fetchGmbEta(cfg){
  const found = await findGmbStop(cfg);
  const url = `https://data.etagmb.gov.hk/eta/route-stop/${found.route_id}/${found.route_seq}/${found.stop_seq}`;
  const res = await fetchWithTimeout(url);
  const json = await res.json();

  let etaArr = json?.data?.eta
    || json?.data?.[0]?.eta
    || (Array.isArray(json?.data) ? json.data.flatMap(d => d.eta || []) : [])
    || [];

  const absTimes = etaArr.slice(0,3).map(t => t.eta || t.timestamp);
  return { direction: cfg.destLabel || found.dest || found.name, etaAbs: absTimes };
}

/* ========== 共用loader：統一處理「暫無班次」同錯誤，減少重複code ========== */

async function loadCard(cardId, fetchFn){
  try{
    const { direction, etaAbs } = await fetchFn();
    if(!etaAbs || etaAbs.length===0){ setCardError(cardId, "暫無班次"); return; }
    setCardData(cardId, direction, etaAbs);
  }catch(e){
    setCardError(cardId, e.message || "未知錯誤");
  }
}

/* ========== 初始化畫面 ========== */

const grid = document.getElementById("grid");
const fetchTasks = [];

MTR_CONFIG.forEach((cfg,i)=>{
  const id = `mtr-${i}`;
  grid.appendChild(makeMtrCard(id, cfg));
  fetchTasks.push((force)=>loadCard(id, ()=>fetchMtrEta(cfg, force)));
});

CTB_CONFIG.forEach((cfg,i)=>{
  const id = `ctb-${i}`;
  grid.appendChild(makeBusCard(id, cfg.title, cfg.route, "", "ctb"));
  fetchTasks.push(()=>loadCard(id, ()=>fetchCtbEta(cfg)));
});

GMB_CONFIG.forEach((cfg,i)=>{
  const id = `gmb-${i}`;
  grid.appendChild(makeBusCard(id, cfg.title, cfg.route, "gmb", "gmb"));
  fetchTasks.push(()=>loadCard(id, ()=>fetchGmbEta(cfg)));
});

/* ========== 全域「最後更新時間」邏輯 ========== */

const lastUpdateTextEl = document.getElementById("lastUpdateText");
const refreshBtn = document.getElementById("refreshBtn");

function updateLastUpdateDisplay(){
  lastUpdateTextEl.textContent = "最後更新: " + timeHHMMSS(new Date());
}

let isFetching = false;
async function fetchAll(force=false){
  if(isFetching) return; // 避免手動refresh同自動refresh同時執行
  isFetching = true;
  refreshBtn.disabled = true;
  refreshBtn.classList.add("spinning");
  try{
    await Promise.all(fetchTasks.map(fn => fn(force)));
  } finally {
    updateLastUpdateDisplay();
    refreshBtn.classList.remove("spinning");
    refreshBtn.disabled = false;
    isFetching = false;
  }
}

/* ========== Master clock ========== */

const REFRESH_SECONDS = 30;
let tickCount = 0;

function updateRefreshIndicator(remaining){
  document.getElementById("nextRefresh").textContent = `下次更新: ${remaining}s`;
  document.getElementById("refreshBar").style.width = `${(remaining/REFRESH_SECONDS)*100}%`;
}

function masterTick(){
  tickCount++;
  renderAllCards();
  const remaining = REFRESH_SECONDS - (tickCount % REFRESH_SECONDS);
  updateRefreshIndicator(remaining);
  if(tickCount % REFRESH_SECONDS === 0) fetchAll(false);
}

/* ---- 手動即刻refresh按鈕：即刻fetch（強制bypass cache） + reset倒數 ---- */
refreshBtn.addEventListener("click", ()=>{
  if(isFetching) return;
  tickCount = 0;
  updateRefreshIndicator(REFRESH_SECONDS);
  fetchAll(true);
});

/* ========== Tab 篩選（記住上次揀嘅filter） ========== */

const FILTER_STORAGE_KEY = "eta-filter-pref";

function applyFilter(f){
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display = (f==="all"||card.dataset.type===f) ? "" : "none";
  });
}

function setActiveTab(f){
  document.querySelectorAll(".tab").forEach(b=>{
    const isActive = b.dataset.filter===f;
    b.classList.toggle("active", isActive);
    b.setAttribute("aria-selected", isActive ? "true" : "false");
  });
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const f = btn.dataset.filter;
    setActiveTab(f);
    applyFilter(f);
    try{ localStorage.setItem(FILTER_STORAGE_KEY, f); }catch(e){ /* 忽略私隱模式錯誤 */ }
  });
});

/* ========== 啟動 ========== */

const savedFilter = (()=>{
  try{ return localStorage.getItem(FILTER_STORAGE_KEY) || "all"; }
  catch(e){ return "all"; }
})();
setActiveTab(savedFilter);
applyFilter(savedFilter);

fetchAll(false);
updateRefreshIndicator(REFRESH_SECONDS);
setInterval(masterTick, 1000);
</script>
</body>
</html>
